[project]
name = "default-project"
version = "1.0.0"
description = "A complex software project"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=26.0",
    "ruff>=0.16",
    "flake8>=7.0",
    "mypy>=2.0",
    "pytest>=9.0",
    "pytest-cov>=5.0",
    "ipython>=9.0",
]

[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]